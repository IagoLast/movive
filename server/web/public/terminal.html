<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LiveTerminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #0d1117; overflow: hidden; }
    #top-bar {
      height: 36px;
      background: #161b22;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid #30363d;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: #8b949e;
    }
    #top-bar .logo { color: #58a6ff; font-weight: 600; }
    #top-bar .status { display: flex; align-items: center; gap: 6px; }
    #top-bar .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #f85149;
      transition: background 0.3s;
    }
    #top-bar .dot.connected { background: #3fb950; }
    #top-bar .btn-disconnect {
      background: none; border: 1px solid #30363d; color: #8b949e;
      padding: 2px 10px; border-radius: 4px; cursor: pointer;
      font-size: 12px;
    }
    #top-bar .btn-disconnect:hover { border-color: #f85149; color: #f85149; }
    #terminal-container {
      height: calc(100% - 36px);
      width: 100%;
    }
    /* Mobile keyboard bar - draggable */
    #mobile-keys {
      display: none;
      position: fixed;
      left: 8px;
      bottom: 20px;
      max-width: calc(100dvw - 16px);
      background: rgba(22, 27, 34, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid #30363d;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      z-index: 1000;
      transition: width 0.2s, height 0.2s;
    }
    #mobile-keys.visible {
      display: block;
    }
    #mobile-keys .bar-header {
      display: flex;
      align-items: center;
      height: 40px;
      padding: 0 8px;
      border-bottom: 1px solid #30363d;
      touch-action: none;
    }
    #mobile-keys .drag-handle {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      cursor: grab;
      color: #484f58;
      font-size: 14px;
      touch-action: none;
    }
    #mobile-keys .drag-handle:active {
      cursor: grabbing;
    }
    #mobile-keys .btn-minimize {
      width: 32px;
      height: 32px;
      background: none;
      border: none;
      color: #8b949e;
      font-size: 18px;
      cursor: pointer;
      border-radius: 6px;
    }
    #mobile-keys .btn-minimize:active {
      background: #30363d;
    }
    #mobile-keys .keys-scroll {
      display: flex;
      padding: 6px 8px;
      gap: 6px;
      align-items: center;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
    }
    #mobile-keys.minimized .keys-scroll {
      display: none;
    }
    #mobile-keys.minimized {
      width: auto !important;
      right: auto !important;
    }
    #mobile-keys button {
      flex-shrink: 0;
      height: 36px;
      min-width: 44px;
      padding: 0 12px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      font-family: 'SF Mono', monospace;
      font-size: 13px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #mobile-keys button:active {
      background: #30363d;
    }
    #mobile-keys button.modifier {
      background: #21262d;
    }
    #mobile-keys button.modifier.active {
      background: #238636;
      border-color: #2ea043;
    }
    #mobile-keys .separator {
      width: 1px;
      height: 24px;
      background: #30363d;
      flex-shrink: 0;
    }
    #loading {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #8b949e;
      font-family: monospace;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="top-bar">
    <span class="logo">LiveTerminal</span>
    <div class="status">
      <span id="status-text">Connecting...</span>
      <span class="dot" id="status-dot"></span>
      <button class="btn-disconnect" id="btn-disconnect" onclick="disconnect()">Disconnect</button>
    </div>
  </div>
  <div id="terminal-container">
    <div id="loading">Connecting to your Mac...</div>
  </div>

  <!-- Mobile special keys bar -->
  <div id="mobile-keys">
    <div class="bar-header">
      <div class="drag-handle">⋮⋮ Keys</div>
      <button class="btn-minimize" id="btn-minimize">−</button>
    </div>
    <div class="keys-scroll">
      <button data-key="Tab">Tab</button>
      <button data-key="Escape">Esc</button>
      <div class="separator"></div>
      <button class="modifier" data-modifier="ctrl">Ctrl</button>
      <button data-key="c" data-with-ctrl>C</button>
      <button data-key="d" data-with-ctrl>D</button>
      <button data-key="z" data-with-ctrl>Z</button>
      <div class="separator"></div>
      <button data-key="ArrowUp">↑</button>
      <button data-key="ArrowDown">↓</button>
      <button data-key="ArrowLeft">←</button>
      <button data-key="ArrowRight">→</button>
      <div class="separator"></div>
      <button data-char="/">/</button>
    </div>
  </div>
  <div id="fullscreen-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:999; cursor:pointer; align-items:center; justify-content:center; flex-direction:column; gap:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:#c9d1d9;">
    <span style="font-size:40px;">&#9654;</span>
    <span style="font-size:16px;">Tap to open fullscreen</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.18.0/lib/addon-webgl.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.min.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const clientId = params.get('id');
    const sessionToken = sessionStorage.getItem('lt-session');
    const wantFullscreen = params.get('fullscreen') === '1';

    if (!clientId || !sessionToken) {
      window.location.href = '/';
    }

    // Fullscreen mode: hide top bar and use full viewport
    if (wantFullscreen) {
      const topBar = document.getElementById('top-bar');
      topBar.style.display = 'none';
      document.getElementById('terminal-container').style.height = '100%';
    }

    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const loading = document.getElementById('loading');

    // xterm.js setup
    const term = new Terminal({
      cursorBlink: true,
      cursorStyle: 'bar',
      fontSize: 14,
      fontFamily: "'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace",
      theme: {
        background: '#0d1117',
        foreground: '#c9d1d9',
        cursor: '#58a6ff',
        cursorAccent: '#0d1117',
        selectionBackground: '#264f78',
        black: '#484f58',
        red: '#ff7b72',
        green: '#3fb950',
        yellow: '#d29922',
        blue: '#58a6ff',
        magenta: '#bc8cff',
        cyan: '#39d353',
        white: '#b1bac4',
        brightBlack: '#6e7681',
        brightRed: '#ffa198',
        brightGreen: '#56d364',
        brightYellow: '#e3b341',
        brightBlue: '#79c0ff',
        brightMagenta: '#d2a8ff',
        brightCyan: '#56d364',
        brightWhite: '#f0f6fc',
      },
      allowProposedApi: true,
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.loadAddon(new WebLinksAddon.WebLinksAddon());

    term.open(document.getElementById('terminal-container'));

    try {
      const webglAddon = new WebglAddon.WebglAddon();
      term.loadAddon(webglAddon);
    } catch {
      // WebGL not available, fallback to canvas
    }

    fitAddon.fit();

    // WebSocket connection
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${proto}//${location.host}/ws?id=${encodeURIComponent(clientId)}&session=${encodeURIComponent(sessionToken)}`;
    let ws = null;
    let reconnectAttempts = 0;
    const MAX_RECONNECT = 5;

    function connect() {
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        loading.style.display = 'none';
        statusDot.classList.add('connected');
        statusText.textContent = clientId;
        reconnectAttempts = 0;

        // Send initial size
        ws.send(JSON.stringify({
          type: 'resize',
          cols: term.cols,
          rows: term.rows,
        }));
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'data') {
            term.write(Uint8Array.from(atob(msg.data), c => c.charCodeAt(0)));
          } else if (msg.type === 'error') {
            term.writeln(`\r\n\x1b[31m[Error] ${msg.message}\x1b[0m`);
          }
        } catch {}
      };

      ws.onclose = () => {
        statusDot.classList.remove('connected');
        statusText.textContent = 'Disconnected';

        if (reconnectAttempts < MAX_RECONNECT) {
          reconnectAttempts++;
          const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 16000);
          statusText.textContent = `Reconnecting in ${delay / 1000}s...`;
          setTimeout(connect, delay);
        } else {
          term.writeln('\r\n\x1b[33m[LiveTerminal] Connection lost. Refresh to reconnect.\x1b[0m');
        }
      };

      ws.onerror = () => {};
    }

    // Terminal input → WebSocket
    term.onData((data) => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        const encoded = btoa(unescape(encodeURIComponent(data)));
        ws.send(JSON.stringify({ type: 'data', data: encoded }));
      }
    });

    // Handle resize
    const resizeObserver = new ResizeObserver(() => {
      fitAddon.fit();
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: 'resize',
          cols: term.cols,
          rows: term.rows,
        }));
      }
    });
    resizeObserver.observe(document.getElementById('terminal-container'));

    function disconnect() {
      if (ws) ws.close();
      sessionStorage.removeItem('lt-session');
      window.location.href = '/';
    }

    // Fullscreen API support
    if (wantFullscreen) {
      const overlay = document.getElementById('fullscreen-overlay');
      overlay.style.display = 'flex';
      overlay.addEventListener('click', () => {
        overlay.style.display = 'none';
        const el = document.documentElement;
        const rfs = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
        if (rfs) rfs.call(el).catch(() => {});
        term.focus();
        setTimeout(() => fitAddon.fit(), 100);
      }, { once: true });
    }

    // Mobile keyboard support
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
                     (navigator.maxTouchPoints > 1 && window.innerWidth < 1024);
    const mobileKeys = document.getElementById('mobile-keys');

    if (isMobile) {
      mobileKeys.classList.add('visible');

      // Restore saved position and minimized state
      const savedPos = localStorage.getItem('lt-keys-pos');
      if (savedPos) {
        const { x, y } = JSON.parse(savedPos);
        mobileKeys.style.left = x + 'px';
        mobileKeys.style.right = 'auto';
        mobileKeys.style.bottom = 'auto';
        mobileKeys.style.top = y + 'px';
      }

      const savedMinimized = localStorage.getItem('lt-keys-minimized') === 'true';
      const btnMinimize = document.getElementById('btn-minimize');
      if (savedMinimized) {
        mobileKeys.classList.add('minimized');
        btnMinimize.textContent = '+';
      }

      // Minimize toggle
      btnMinimize.addEventListener('click', () => {
        const isMinimized = mobileKeys.classList.toggle('minimized');
        btnMinimize.textContent = isMinimized ? '+' : '−';
        localStorage.setItem('lt-keys-minimized', isMinimized);
      });

      // Drag functionality
      const barHeader = mobileKeys.querySelector('.bar-header');
      let isDragging = false;
      let startX, startY, startLeft, startTop;

      barHeader.addEventListener('touchstart', (e) => {
        if (e.target.closest('.btn-minimize')) return;
        isDragging = true;
        const touch = e.touches[0];
        const rect = mobileKeys.getBoundingClientRect();
        startX = touch.clientX;
        startY = touch.clientY;
        startLeft = rect.left;
        startTop = rect.top;
        mobileKeys.style.transition = 'none';
        e.preventDefault();
      }, { passive: false });

      document.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const touch = e.touches[0];
        const dx = touch.clientX - startX;
        const dy = touch.clientY - startY;

        let newLeft = startLeft + dx;
        let newTop = startTop + dy;

        // Keep within bounds
        const maxX = window.innerWidth - mobileKeys.offsetWidth;
        const maxY = window.innerHeight - mobileKeys.offsetHeight;
        newLeft = Math.max(0, Math.min(newLeft, maxX));
        newTop = Math.max(0, Math.min(newTop, maxY));

        mobileKeys.style.left = newLeft + 'px';
        mobileKeys.style.right = 'auto';
        mobileKeys.style.bottom = 'auto';
        mobileKeys.style.top = newTop + 'px';
      }, { passive: true });

      document.addEventListener('touchend', () => {
        if (!isDragging) return;
        isDragging = false;
        mobileKeys.style.transition = '';
        // Save position
        const rect = mobileKeys.getBoundingClientRect();
        localStorage.setItem('lt-keys-pos', JSON.stringify({ x: rect.left, y: rect.top }));
      });
    }

    // Key mappings
    const keyMap = {
      'Tab': '\t',
      'Escape': '\x1b',
      'ArrowUp': '\x1b[A',
      'ArrowDown': '\x1b[B',
      'ArrowRight': '\x1b[C',
      'ArrowLeft': '\x1b[D',
      'Home': '\x1b[H',
      'End': '\x1b[F',
    };

    let ctrlActive = false;
    const ctrlBtn = mobileKeys.querySelector('[data-modifier="ctrl"]');

    mobileKeys.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;

      // Handle Ctrl modifier toggle
      if (btn.dataset.modifier === 'ctrl') {
        ctrlActive = !ctrlActive;
        btn.classList.toggle('active', ctrlActive);
        return;
      }

      let seq = '';

      // Direct sequence
      if (btn.dataset.seq) {
        seq = btn.dataset.seq;
      }
      // Direct character
      else if (btn.dataset.char) {
        seq = btn.dataset.char;
      }
      // Special key
      else if (btn.dataset.key && keyMap[btn.dataset.key]) {
        seq = keyMap[btn.dataset.key];
      }
      // Letter with optional Ctrl
      else if (btn.dataset.key) {
        const key = btn.dataset.key.toLowerCase();
        if (ctrlActive || btn.dataset.withCtrl !== undefined) {
          // Ctrl+letter = letter code - 96 (a=1, b=2, etc.)
          seq = String.fromCharCode(key.charCodeAt(0) - 96);
        } else {
          seq = key;
        }
      }

      if (seq && ws && ws.readyState === WebSocket.OPEN) {
        const encoded = btoa(unescape(encodeURIComponent(seq)));
        ws.send(JSON.stringify({ type: 'data', data: encoded }));
      }

      // Auto-disable Ctrl after use (unless it's a modifier-only press)
      if (ctrlActive && btn.dataset.modifier !== 'ctrl') {
        ctrlActive = false;
        ctrlBtn.classList.remove('active');
      }

      // Keep terminal focused
      term.focus();
    });

    // Go
    connect();
    if (!wantFullscreen) term.focus();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LiveTerminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #0d1117; overflow: hidden; }
    #top-bar {
      height: 36px;
      background: #161b22;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid #30363d;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: #8b949e;
    }
    #top-bar .logo { color: #58a6ff; font-weight: 600; }
    #top-bar .status { display: flex; align-items: center; gap: 6px; }
    #top-bar .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #f85149;
      transition: background 0.3s;
    }
    #top-bar .dot.connected { background: #3fb950; }
    #top-bar .btn-disconnect {
      background: none; border: 1px solid #30363d; color: #8b949e;
      padding: 2px 10px; border-radius: 4px; cursor: pointer;
      font-size: 12px;
    }
    #top-bar .btn-disconnect:hover { border-color: #f85149; color: #f85149; }
    #terminal-container {
      height: calc(100% - 36px);
      width: 100%;
    }
    #loading {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #8b949e;
      font-family: monospace;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="top-bar">
    <span class="logo">LiveTerminal</span>
    <div class="status">
      <span id="status-text">Connecting...</span>
      <span class="dot" id="status-dot"></span>
      <button class="btn-disconnect" id="btn-disconnect" onclick="disconnect()">Disconnect</button>
    </div>
  </div>
  <div id="terminal-container">
    <div id="loading">Connecting to your Mac...</div>
  </div>
  <div id="fullscreen-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:999; cursor:pointer; align-items:center; justify-content:center; flex-direction:column; gap:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:#c9d1d9;">
    <span style="font-size:40px;">&#9654;</span>
    <span style="font-size:16px;">Tap to open fullscreen</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.18.0/lib/addon-webgl.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.min.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const clientId = params.get('id');
    const sessionToken = sessionStorage.getItem('lt-session');
    const wantFullscreen = params.get('fullscreen') === '1';

    if (!clientId || !sessionToken) {
      window.location.href = '/';
    }

    // Fullscreen mode: hide top bar and use full viewport
    if (wantFullscreen) {
      const topBar = document.getElementById('top-bar');
      topBar.style.display = 'none';
      document.getElementById('terminal-container').style.height = '100%';
    }

    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const loading = document.getElementById('loading');

    // xterm.js setup
    const term = new Terminal({
      cursorBlink: true,
      cursorStyle: 'bar',
      fontSize: 14,
      fontFamily: "'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace",
      theme: {
        background: '#0d1117',
        foreground: '#c9d1d9',
        cursor: '#58a6ff',
        cursorAccent: '#0d1117',
        selectionBackground: '#264f78',
        black: '#484f58',
        red: '#ff7b72',
        green: '#3fb950',
        yellow: '#d29922',
        blue: '#58a6ff',
        magenta: '#bc8cff',
        cyan: '#39d353',
        white: '#b1bac4',
        brightBlack: '#6e7681',
        brightRed: '#ffa198',
        brightGreen: '#56d364',
        brightYellow: '#e3b341',
        brightBlue: '#79c0ff',
        brightMagenta: '#d2a8ff',
        brightCyan: '#56d364',
        brightWhite: '#f0f6fc',
      },
      allowProposedApi: true,
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.loadAddon(new WebLinksAddon.WebLinksAddon());

    term.open(document.getElementById('terminal-container'));

    try {
      const webglAddon = new WebglAddon.WebglAddon();
      term.loadAddon(webglAddon);
    } catch {
      // WebGL not available, fallback to canvas
    }

    fitAddon.fit();

    // WebSocket connection
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${proto}//${location.host}/ws?id=${encodeURIComponent(clientId)}&session=${encodeURIComponent(sessionToken)}`;
    let ws = null;
    let reconnectAttempts = 0;
    const MAX_RECONNECT = 5;

    function connect() {
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        loading.style.display = 'none';
        statusDot.classList.add('connected');
        statusText.textContent = clientId;
        reconnectAttempts = 0;

        // Send initial size
        ws.send(JSON.stringify({
          type: 'resize',
          cols: term.cols,
          rows: term.rows,
        }));
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'data') {
            term.write(Uint8Array.from(atob(msg.data), c => c.charCodeAt(0)));
          } else if (msg.type === 'error') {
            term.writeln(`\r\n\x1b[31m[Error] ${msg.message}\x1b[0m`);
          }
        } catch {}
      };

      ws.onclose = () => {
        statusDot.classList.remove('connected');
        statusText.textContent = 'Disconnected';

        if (reconnectAttempts < MAX_RECONNECT) {
          reconnectAttempts++;
          const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 16000);
          statusText.textContent = `Reconnecting in ${delay / 1000}s...`;
          setTimeout(connect, delay);
        } else {
          term.writeln('\r\n\x1b[33m[LiveTerminal] Connection lost. Refresh to reconnect.\x1b[0m');
        }
      };

      ws.onerror = () => {};
    }

    // Terminal input → WebSocket
    term.onData((data) => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        const encoded = btoa(unescape(encodeURIComponent(data)));
        ws.send(JSON.stringify({ type: 'data', data: encoded }));
      }
    });

    // Handle resize
    const resizeObserver = new ResizeObserver(() => {
      fitAddon.fit();
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: 'resize',
          cols: term.cols,
          rows: term.rows,
        }));
      }
    });
    resizeObserver.observe(document.getElementById('terminal-container'));

    function disconnect() {
      if (ws) ws.close();
      sessionStorage.removeItem('lt-session');
      window.location.href = '/';
    }

    // Fullscreen API support
    if (wantFullscreen) {
      const overlay = document.getElementById('fullscreen-overlay');
      overlay.style.display = 'flex';
      overlay.addEventListener('click', () => {
        overlay.style.display = 'none';
        const el = document.documentElement;
        const rfs = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
        if (rfs) rfs.call(el).catch(() => {});
        term.focus();
        setTimeout(() => fitAddon.fit(), 100);
      }, { once: true });
    }

    // Go
    connect();
    if (!wantFullscreen) term.focus();
  </script>
</body>
</html>
